    <rect x="360" y="52" width="260" height="164" rx="12" fill="#fff" opacity="0.94"/>
    <rect x="360" y="52" width="260" height="164" rx="12" fill="none" stroke="#0a2a66" stroke-opacity="0.35" stroke-width="6"/>
