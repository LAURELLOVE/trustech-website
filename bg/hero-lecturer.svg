  <g fill="#f0b429"><path d="M330 36 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" opacity="0.9"/><path d="M660 80 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.8"/></g>
